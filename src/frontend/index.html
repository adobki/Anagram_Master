<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta
      name="description"
      content="A timed word game: rearrange the letters of a root word to form as many new words as you can."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Anagram Master</title>
    <script>
      // Apply the saved (or system) theme before first paint, so the page
      // never flashes the wrong one. src/lib/theme.svelte.ts takes over after
      // load; the colours are --bg from src/styles/tokens.css.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('am-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d0c11' : '#f6f5f2'
      })()
      // Text size, motion and contrast (src/lib/settings.svelte.ts keeps them up to date).
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem('am-settings') || 'null') || {}
          var root = document.documentElement
          if (s.textSize === 'small' || s.textSize === 'large') root.dataset.text = s.textSize
          if (s.motion === 'reduced' || s.motion === 'full') root.dataset.motion = s.motion
          var contrast = typeof s.highContrast === 'boolean' ? s.highContrast : matchMedia('(prefers-contrast: more)').matches
          if (contrast) root.dataset.contrast = 'high'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
